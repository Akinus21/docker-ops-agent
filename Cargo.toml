[package]
name = "docker-ops-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.40.0", features = ["full"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
once_cell = "=1.19.0"
regex = "=1.10.6"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
uuid = { version = "=1.10.0", features = ["v4"] }
chrono = "=0.4.38"
